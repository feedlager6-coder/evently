<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Ambient Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#141724" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B0D13" stop-opacity="1" />
    </radialGradient>

    <!-- Signature Ivently Linear Gradient -->
    <linearGradient id="brandGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Needle Top-Right (North) Gradient -->
    <linearGradient id="needleNorth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>

    <!-- Needle Bottom-Left (South) Gradient -->
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>

    <!-- Drop Shadow Filter for Squircle -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="#6366F1" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Inner Glow for Squircle -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- 1. Deep OLED Canvas (Safe Background) -->
  <rect width="512" height="512" fill="url(#bgGlow)" />

  <!-- 2. Circular Guide Layer for Telegram Circular Cropping (Hidden / Native Fit) -->
  <!-- Center: (256, 256), Radius: 256 -->

  <!-- 3. Central Rounded Squircle (Badge) -->
  <rect
    x="86"
    y="86"
    width="340"
    height="340"
    rx="82"
    ry="82"
    fill="url(#brandGradient)"
    filter="url(#badgeShadow)"
  />

  <!-- Subtle Rim Light / Border on Squircle -->
  <rect
    x="87"
    y="87"
    width="338"
    height="338"
    rx="81"
    ry="81"
    fill="none"
    stroke="url(#borderGlow)"
    stroke-width="2.5"
  />

  <!-- 4. Compass Outer Ring -->
  <!-- Radius 105px, stroke-width 13px -->
  <circle
    cx="256"
    cy="256"
    r="105"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="13"
    stroke-linecap="round"
  />

  <!-- Cardinal Tick Marks for Navigation Dial -->
  <!-- North -->
  <line x1="256" y1="133" x2="256" y2="145" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <!-- South -->
  <line x1="256" y1="367" x2="256" y2="379" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.75" />
  <!-- East -->
  <line x1="379" y1="256" x2="367" y2="256" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.75" />
  <!-- West -->
  <line x1="133" y1="256" x2="145" y2="256" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.75" />

  <!-- 5. Dynamic Compass Needle -->
  <!-- North-East Needle Half -->
  <polygon
    points="256,256 242,228 326,186 284,270"
    fill="url(#needleNorth)"
  />

  <!-- South-West Needle Half -->
  <polygon
    points="256,256 228,242 186,326 270,284"
    fill="url(#needleSouth)"
  />

  <!-- Central Pivot Pin -->
  <circle cx="256" cy="256" r="14" fill="#FFFFFF" />
  <circle cx="256" cy="256" r="6" fill="#4338CA" />
</svg>
