services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /var/lib/ivently/uploads:/var/www/uploads:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - ivently-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /var/lib/ivently/uploads:/app/uploads
      - ./backend:/app/backend
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - ivently-net

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ivently_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ivently_prod
    volumes:
      - /var/lib/ivently/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivently_user -d ivently_prod"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ivently-net

volumes:
  caddy_data:
  caddy_config:

networks:
  ivently-net:
    driver: bridge
